<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Website Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <div class="container-fluid p-0">
        <header class="admin-topbar">
            <a href="/" class="admin-brand" aria-label="Go to home">
                <img src="/img/SBDC.svg" alt="SBDC logo">
            </a>
            <div class="admin-global-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="search" placeholder="Search..." aria-label="Global search">
            </div>
            <div class="admin-topbar-actions" aria-label="Account actions">
                <button class="topbar-icon" type="button" aria-label="Notifications">
                    <i class="bi bi-bell"></i>
                    <span class="notification-dot"></span>
                </button>
                <button class="profile-chip" type="button" aria-label="Open profile menu">
                    <i class="bi bi-person-fill"></i>
                    <i class="bi bi-chevron-down profile-chevron"></i>
                </button>
            </div>
        </header>

        <div class="row g-0 shadow">

            <!-- MAIN WORKSPACE DESK AREA -->
            <div class="col-12 workspace-panel">

                <!-- System Area Greeting Header -->
                <div class="main-page-header hero-card d-flex justify-content-between align-items-center mb-5">

                    <div class="hero-copy">
                        <div class="hero-icon" aria-hidden="true"><i class="bi bi-image"></i></div>

                        <div>
                            <h1 class="h3 fw-bold mb-1">Service Images</h1>
                        <p class="text-muted small mb-0">Add and manage images for your services</p>
                        </div>
                    </div>

                    <div class="main-actions d-flex gap-2 ms-auto">
                        <button id="newBtn" class="btn btn-brand-action" type="button" data-bs-toggle="modal"
                            data-bs-target="#newEntryModal"><i class="bi bi-plus-lg me-1"></i> New Entry</button>
                        <input id="fileInput" type="file" style="display:none;" />
                    </div>
                </div>

                <!-- New Entry Modal -->
                <div class="modal fade" id="newEntryModal" tabindex="-1" aria-labelledby="newEntryModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="newEntryModalLabel">New Entry</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">

                                <div class="row g-6 mb-4">
                                    <label class="form-label fw-bold mb-2">Image</label>
                                    <div class="col-2 col-md-2">
                                        <button id="newEntryUploadBtn" class="btn btn-brand-action mb-3"
                                            type="button"><i class="bi bi-upload me-1"></i> Upload Image</button>
                                        <input id="newEntryFileInput" type="file" name="file" style="display:none;" />
                                    </div>

                                    <div class="col-10">
                                        <input id="file_name" type="text" class="form-control mb-3"
                                            style="font-size: 14px;" placeholder="File name" readonly>
                                        <div id="selectedFileName" class="form-text mt-2">No file chosen</div>
                                    </div>
                                </div>

                                <div class="row g-6 mb-4">

                                    <div class="col-6 col-md-6">
                                        <label class="form-label" style="font-size: 14px;">Service</label>
                                        <select id="source" class="form-control mb-3" style="font-size: 14px;">
                                            <option value="">Select Source</option>
                                            <option value="Architectural & Engineering Design">Architectural & Engineering Design</option>
                                            <option value="General Constructions">General Constructions</option>
                                            <option value="Electro - Mechanical Works">Electro - Mechanical Works</option>
                                        </select>
                                    </div>

                                    <!-- div class="col-5 col-md-6">
                                        <label class="form-label" style="font-size: 14px;">Date</label>
                                        <input id="date" type="date" class="form-control" style="font-size: 14px;">
                                    </div -->

                                    <div class="col-6 col-md-6">
                                        <label class="form-label" style="font-size: 14px;">Projects Name</label>
                                        <input id="project_name" type="text" class="form-control mb-3" style="font-size: 14px;"
                                            placeholder="Projects Name">
                                    </div>

                                </div>

                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-subtle"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button id="saveAccountingBtn" type="button" class="btn btn-brand-action">Save</button>
                            </div>
                        </div>
                    </div>
                </div>



                <div class="toolbar-row mb-3">
                    <div class="toolbar-spacer"></div>

                    <div class="toolbar-actions">
                        <div class="dropdown">
                            <button id="accountingFilterBtn" class="btn btn-outline-subtle dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-funnel me-1"></i>
                                Filter
                            </button>

                            <ul class="dropdown-menu dropdown-menu-end" id="accountingFilterMenu">
                                <li>
                                    <button class="dropdown-item accounting-filter-option active" type="button"
                                        data-filter="all">
                                        All
                                    </button>
                                </li>

                                <li>
                                    <hr class="dropdown-divider">
                                </li>

                                <li><button class="dropdown-item accounting-filter-option" type="button"
                                        data-filter="image">Image</button></li>
                                <li><button class="dropdown-item accounting-filter-option" type="button"
                                        data-filter="service">Service</button></li>
                                <li><button class="dropdown-item accounting-filter-option" type="button"
                                    data-filter="date_added">Date Added</button></li>
                                <li><button class="dropdown-item accounting-filter-option" type="button"
                                        data-filter="projects_name">Projects Name</button></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-with-actions">
                    <div id="accountingTableWrapper" class="main-table-wrapper table-responsive shadow rounded-4">
                        <table class="table table-premium accounting-table align-middle">
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Service</th>
                                    <th>Date Added</th>
                                    <th>Projects Name</th>
                                </tr>
                            </thead>
                            <tbody id="accountingTableBody">
                                <tr>
                                    <td colspan="4" class="text-center text-muted py-4"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div id="actionPanel" class="user-action-panel">
                        <table class="table table-premium action-table align-middle">
                            <thead>
                                <tr>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="actionTableBody">
                                <tr>
                                    <td class="text-center text-muted py-4">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Edit Modal -->


    <!-- Image Preview Modal -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-labelledby="imagePreviewModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-fullscreen">
            <div class="modal-content image-preview-modal-content">
                <div class="modal-header image-preview-modal-header">
                    <h5 class="modal-title" id="imagePreviewModalLabel">Image Preview</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body image-preview-modal-body">
                    <img id="imagePreview" src="" alt="Full image preview">
                </div>
            </div>
        </div>
    </div>


    <!-- Delete Confirm Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this accounting entry?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-subtle" data-bs-dismiss="modal">Cancel</button>
                    <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/filter.js"></script>
    <script src="/js/index.js"></script>

</body>

</html>
