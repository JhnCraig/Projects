<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Admin - Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>

    <div class="container-fluid p-0">
        <div class="row g-0 shadow">
            
            <!-- SIDEBAR PANEL SECTION -->
            <div class="col-10 col-md-3 col-xl-2 admin-sidebar d-flex flex-column" style="height: 60rem;">
                <img src="img/Logo.svg" class="card-svg mt-3 mb-5" style="width: 100%; height: auto;" alt="SBDC logo">

                <ul class="nav flex-column nav-admin flex-grow-1">
                    <li><a href="index.html" class="nav-link mt-5 active"><i class="bi bi-sliders"></i> Overview</a></li>
                    <li><a href="accounting.html" class="nav-link"><i class="bi bi-receipt"></i> Accounting</a></li>
                    <li><a href="sales.html" class="nav-link"><i class="bi bi-graph-up"></i> Sales</a></li>
                    <li><a href="marketing.html" class="nav-link "><i class="bi bi-bar-chart"></i>Sales / Marketing</a></li>
                    <li><a href="purchasing.html" class="nav-link"><i class="bi bi-cart"></i> Purchasing</a></li>
                    <li><a href="engineering.html" class="nav-link"><i class="bi bi-cpu"></i> Engineering</a></li>
                    <li><a href="users.html" class="nav-link"><i class="bi bi-people"></i> User's Management</a></li>
                </ul>

                <div class="pt-3 border-top border-secondary border-opacity-20">
                    <div class="dropup sidebar-profile-dropdown">
                        <button type="button" class="dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="d-flex align-items-center">
                                <i class="bi bi-person-circle me-2"></i>
                                <span data-user-display>User</span>
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i><span data-user-display>User</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="login.html"><i class="bi bi-box-arrow-left me-2"></i>Log Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const userNameTargets = document.querySelectorAll('[data-user-display]');

        fetch('/api/current-user')
            .then((response) => response.ok ? response.json() : null)
            .then((user) => {
                const name = user?.name || 'User';
                const firstName = name.split(' ')[0] || 'User';
                userNameTargets.forEach((element) => {
                    element.textContent = firstName;
                });
            })
            .catch(() => {
                userNameTargets.forEach((element) => {
                    element.textContent = 'User';
                });
            });
    </script>

</body>

</html>
