<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Admin - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..900;1,400..900&family=Poppins:wght=300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="min-vh-100 d-flex justify-content-center align-items-center p-3">
        <div class="card auth-card shadow">
            <div class="p-4 p-sm-5">

                <div class="mb-4 text-center">
                    <h1 class="h2 fw-bold text-white mb-1">Sign In</h1>
                    <p class="text-white small">
                        Welcome back! Please sign in to your dashboard.
                    </p>
                </div>

                <form action="/login" method="POST" autocomplete="off">

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="emailAddress" name="email"
                            placeholder="name@example.com" required>
                        <label for="emailAddress">Email Address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="userPassword" name="password"
                            placeholder="Password" required>
                        <label for="userPassword">Password</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 small">
                        <div class="form-check text-start">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                            <label class="form-check-label text-white" for="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <a href="#forgotPasswordModal" class="text-decoration-none fw-medium" style="color: #86b6d5;" data-bs-toggle="modal">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="btn btn-submit w-100 mb-4 shadow-sm">
                        Log In
                    </button>

                    <div class="text-center">
                        <p class="small text-white mb-3">
                            New to our community?
                            <a href="signup.html" class="fw-semibold text-decoration-none" style="color: #86b6d5;">
                                Create an Account
                            </a>
                        </p>

                        <hr class="w-25 mx-auto opacity-25 my-3">
                        
                        <!-- Navigation Links 
                        <a href="index.html" class="btn-back pe-3 d-inline-flex align-items-left gap-2">
                            <i class="bi bi-arrow-left"></i>
                            Admin
                        </a>

                        <a href="/employee" class="btn-back ps-3 d-inline-flex align-items-right gap-2">
                            Employee
                            <i class="bi bi-arrow-right"></i>
                        </a> -->

                    </div>

                </form>

            </div>
        </div>
    </div>

    <div class="modal fade" id="adminSetupModal" tabindex="-1" aria-labelledby="adminSetupModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminSetupModalLabel">Admin account required</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    No admin account exists yet. Create the first user account to automatically assign as Admin.
                </div>
                <div class="modal-footer">
                    <a href="signup.html?admin_setup=1" class="btn btn-submit">Create Admin User</a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class=" forgot-password modal-content">
                <form id="forgotPasswordForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="forgotPasswordModalLabel" style="color: white;">Reset Password</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="forgotPasswordMessage" class="alert d-none" role="alert"></div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="resetEmail" placeholder="Email Address" required>
                            <label for="resetEmail">Email Address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="resetContact" placeholder="Contact Number" required>
                            <label for="resetContact">Contact Number</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="resetPassword" placeholder="New Password" required minlength="6">
                            <label for="resetPassword">New Password</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" class="form-control" id="resetConfirmPassword" placeholder="Confirm New Password" required minlength="6">
                            <label for="resetConfirmPassword">Confirm New Password</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-submit">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const forgotPasswordMessage = document.getElementById('forgotPasswordMessage');

        forgotPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            forgotPasswordMessage.className = 'alert d-none';

            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('resetEmail').value,
                    contact: document.getElementById('resetContact').value,
                    password: document.getElementById('resetPassword').value,
                    confirm_password: document.getElementById('resetConfirmPassword').value
                })
            });
            const result = await response.json().catch(() => ({}));
            forgotPasswordMessage.textContent = result.error || (response.ok ? 'Password updated. You can now log in.' : 'Unable to reset password.');
            forgotPasswordMessage.className = `alert ${response.ok ? 'alert-success' : 'alert-danger'}`;
            if (response.ok) {
                forgotPasswordForm.reset();
                setTimeout(() => bootstrap.Modal.getInstance(document.getElementById('forgotPasswordModal'))?.hide(), 1200);
            }
        });

        fetch('/api/admin-status')
            .then(response => response.ok ? response.json() : Promise.reject(response))
            .then(result => {
                if (!result.has_admin) {
                    bootstrap.Modal.getOrCreateInstance(document.getElementById('adminSetupModal')).show();
                }
            })
            .catch(() => {});
    </script>

</body>

</html>
