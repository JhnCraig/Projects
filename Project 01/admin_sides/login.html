<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Admin - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..900;1,400..900&family=Poppins:wght=300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="min-vh-100 d-flex justify-content-center align-items-center p-3">
        <div class="card auth-card shadow">
            <div class="p-4 p-sm-5">

                <div class="mb-4 text-center">
                    <h1 class="h2 fw-bold text-white mb-1">Sign In</h1>
                    <p class="text-white small">
                        Welcome back! Please sign in to your dashboard.
                    </p>
                </div>

                <form action="login.html" method="POST" autocomplete="off">

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="emailAddress" name="email"
                            placeholder="name@example.com" required>
                        <label for="emailAddress">Email Address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="userPassword" name="password"
                            placeholder="Password" required>
                        <label for="userPassword">Password</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 small">
                        <div class="form-check text-start">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                            <label class="form-check-label text-white" for="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <a href="#" class="text-decoration-none fw-medium" style="color: #86b6d5;">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit" class="btn btn-submit w-100 mb-4 shadow-sm">
                        Log In
                    </button>

                    <div class="text-center">
                        <p class="small text-white mb-3">
                            New to our community?
                            <a href="signup.html" class="fw-semibold text-decoration-none" style="color: #86b6d5;">
                                Create an Account
                            </a>
                        </p>

                        <hr class="w-25 mx-auto opacity-25 my-3">

                        <a href="index.html" class="btn-back pe-3 d-inline-flex align-items-left gap-2">
                            <i class="bi bi-arrow-left"></i>
                            Admin
                        </a>

                        <a href="/employee" class="btn-back ps-3 d-inline-flex align-items-right gap-2">
                            Employee
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
