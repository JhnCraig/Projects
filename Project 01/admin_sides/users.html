<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Admin - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0 shadow">

            <!-- SIDEBAR PANEL SECTION -->
            <div class="col-10 col-md-3 col-xl-2 admin-sidebar d-flex flex-column" style="height: 60rem;">
                <img src="img/Logo.svg" class="card-svg mt-3 mb-5" style="width: 100%; height: auto;" alt="SBDC logo">

                <ul class="nav flex-column nav-admin flex-grow-1">
                    <li><a href="index.html" class="nav-link mt-5"><i class="bi bi-sliders"></i>Overview</a></li>
                    <li><a href="accounting.html" class="nav-link"><i class="bi bi-receipt"></i>Accounting</a></li>
                    <li><a href="sales.html" class="nav-link"><i class="bi bi-graph-up"></i>Sales</a></li>
                    <li><a href="marketing.html" class="nav-link"><i class="bi bi-bar-chart"></i>Sales / Marketing</a></li>
                    <li><a href="purchasing.html" class="nav-link"><i class="bi bi-cart"></i>Purchasing</a></li>
                    <li><a href="engineering.html" class="nav-link"><i class="bi bi-cpu"></i>Engineering</a></li>
                    <li><a href="users.html" class="nav-link active"><i class="bi bi-people"></i>User's Management</a></li>
                </ul>

                <div class="pt-3 border-top border-secondary border-opacity-20">
                    <div class="dropup sidebar-profile-dropdown">
                        <button type="button" class="dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="d-flex align-items-center">
                                <i class="bi bi-person-circle me-2"></i>
                                <span data-user-display>User</span>
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i><span data-user-display>User</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="login.html"><i class="bi bi-box-arrow-left me-2"></i>Log Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- MAIN WORKSPACE DESK AREA -->
            <div class="col-12 col-md-9 col-xl-10 workspace-panel">

                <!-- System Area Greeting Header -->
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h1 class="h3 fw-bold mb-1">Users Management</h1>
                        <p class="text-muted small mb-0">Manage your user accounts and permissions</p>
                    </div>

                    <div class="d-flex gap-2 ms-auto">
                        <button id="newBtn" class="btn btn-brand-action" type="button" data-bs-toggle="modal"
                            data-bs-target="#newEntryModal">
                            <i class="bi bi-plus-lg me-1"></i>
                            New User
                        </button>
                        <input id="fileInput" type="file" style="display:none;">
                    </div>
                </div>

                <!-- New Entry Modal -->
                <div class="modal fade" id="newEntryModal" tabindex="-1" aria-labelledby="newEntryModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="newEntryModalLabel">New User</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>

                            <div class="modal-body" style="height: 25rem;">
                                <div class="row g-6">
                                    <div class="col-5 col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="User Email">
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="User Password">
                                    </div>
                                </div>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-subtle"
                                    data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-brand-action">Save</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="table-with-actions">

                    <!-- MAIN TABLE -->
                    <div class="main-table-wrapper shadow rounded-4">
                        <table class="table table-premium align-middle">
                            <thead>
                                <tr>
                                    <th>Acc. No.</th>
                                    <th>Name</th>
                                    <th>Contact</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th>Password</th>
                                    <th>Created</th>
                                </tr>
                            </thead>

                            <tbody id="userTableBody">
                                <tr>
                                    <td colspan="7" class="text-center text-muted"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- EDIT / DELETE OUTSIDE TABLE -->
                    <div id="userActionPanel" class="user-action-panel"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" style="height: 25rem;">
                    <input type="hidden" id="editUserId">
                    <div class="row g-3">
                        <div class="col-md-4"><label for="editUserFname" class="form-label">First Name</label><input id="editUserFname" type="text" class="form-control"></div>
                        <div class="col-md-4"><label for="editUserMname" class="form-label">Middle Name</label><input id="editUserMname" type="text" class="form-control"></div>
                        <div class="col-md-4"><label for="editUserLname" class="form-label">Last Name</label><input id="editUserLname" type="text" class="form-control"></div>
                        <div class="col-md-6"><label for="editUserContact" class="form-label">Contact</label><input id="editUserContact" type="text" class="form-control"></div>
                        <div class="col-md-6"><label for="editUserStatus" class="form-label">Status</label><select id="editUserStatus" class="form-select"><option value="Employee">Employee</option><option value="Admin">Admin</option><option value="Inactive">Inactive</option></select></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-subtle" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-outline-secondary" id="openSetPasswordModalBtn">Set Password</button>
                    <button type="button" class="btn btn-brand-action" id="saveEditedUserBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Set Password Modal -->
    <div class="modal fade" id="setPasswordModal" tabindex="-1" aria-labelledby="setPasswordModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="setPasswordModalLabel">Set Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="setPasswordUserId">

                    <div class="mb-3">
                        <label for="newPasswordInput" class="form-label">New Password</label>
                        <input type="password" id="newPasswordInput" class="form-control" placeholder="Enter password">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPasswordInput" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPasswordInput" class="form-control"
                            placeholder="Confirm password">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-subtle" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-brand-action" id="savePasswordBtn">Save Password</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/users.js"></script>
    <script>
        
    </script>

</body>

</html>
