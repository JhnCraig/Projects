<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SBDC Admin - Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card auth-card">
            <div class="p-4 p-sm-5">

                <!-- Heading -->
                <div class="mb-4 text-center">
                    <h1 class="h2 fw-bold text-white mb-1">
                        Create Account
                    </h1>
                    <p class="text-white small mb-0">
                        Please fill in your details to register.
                    </p>
                </div>

                <!-- Signup Form -->
                <form action="/signup" method="POST" autocomplete="off">

                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <div class="form-floating">
                                <input type="text" class="form-control rounded-3" id="fName" name="Fname" placeholder="First Name" required>
                                <label for="fName">First Name</label>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="form-floating">
                                <input type="text" class="form-control rounded-3" id="mName" name="Mname" placeholder="Middle Name">
                                <label for="mName">Middle Name</label>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="form-floating">
                                <input type="text" class="form-control rounded-3" id="lName" name="Lname" placeholder="Last Name" required>
                                <label for="lName">Last Name</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="tel" class="form-control rounded-3" id="contact" name="contact" placeholder="Contact Number" required>
                        <label for="contact">Contact Number</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="emailAddress" name="email" placeholder="Email Address" required>
                        <label for="emailAddress">Email Address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="userPassword" name="password" placeholder="Password" required>
                        <label for="userPassword">Password</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-3" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required>
                        <label for="confirmPassword">Confirm Password</label>
                    </div>

                    <div class="form-check text-start mb-4 small">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label text-white"
                               for="termsCheck">
                            I agree to the

                            <a href="#"
                               class="text-decoration-none"
                               style="color: #86b6d5;">
                                Terms of Service
                            </a>

                            &

                            <a href="#"
                               class="text-decoration-none"
                               style="color: #86b6d5;">
                                Privacy Policy
                            </a>

                        </label>
                    </div>

                    <button type="submit" class="btn btn-submit w-100 mb-4 shadow-sm">Register Account</button>

                    <div class="text-center">
                        <p class="small text-white mb-3">

                            Already have an account?

                            <a href="login.html"
                               class="fw-semibold text-decoration-none"
                               style="color: #86b6d5;">

                                Log In Here

                            </a>
                        </p>


                        <hr class="w-25 mx-auto opacity-25 my-3">

                    </div>
                </form>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
