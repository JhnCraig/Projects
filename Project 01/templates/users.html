<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Admin - Users</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>

    <div class="container-fluid p-0">
        <div class="row g-0 shadow">

            <!-- SIDEBAR PANEL SECTION -->
            <div class="col-10 col-md-3 col-xl-2 admin-sidebar d-flex flex-column" style="height: 60rem;">
                <img src="img/Logo.svg" class="card-svg mt-3 mb-5" style="width: 100%; height: auto;" alt="SBDC logo">

                <ul class="nav flex-column nav-admin flex-grow-1">
                    <li><a href="index.html" class="nav-link mt-5"><i class="bi bi-sliders"></i> Overview</a></li>
                    <li><a href="accounting.html" class="nav-link"><i class="bi bi-receipt"></i> Accounting</a></li>
                    <li><a href="sales.html" class="nav-link"><i class="bi bi-graph-up"></i> Sales</a></li>
                    <li><a href="marketing.html" class="nav-link "><i class="bi bi-bar-chart"></i>Sales / Marketing</a></li>
                    <li><a href="purchasing.html" class="nav-link"><i class="bi bi-cart"></i> Purchasing</a></li>
                    <li><a href="engineering.html" class="nav-link"><i class="bi bi-cpu"></i> Engineering</a></li>
                    <li><a href="users.html" class="nav-link active"><i class="bi bi-people"></i> User's Management</a></li>
                </ul>

                <div class="pt-3 border-top border-secondary border-opacity-20">
                    <a href="login.html" class="nav-link ms-2 text-white-50 small text-decoration-none d-flex align-items-center">
                        Log Out <i class="bi bi-arrow-right-circle ms-2"></i>
                    </a>
                </div>
            </div>

            <!-- MAIN WORKSPACE DESK AREA -->
            <div class="col-12 col-md-9 col-xl-10 workspace-panel">

                <!-- System Area Greeting Header -->
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h1 class="h3 fw-bold mb-1">Users Management</h1>
                        <p class="text-muted small mb-0">Manage your user accounts and permissions</p>
                    </div>
                    <div class="d-flex gap-2 ms-auto">
                        <button id="newBtn" class="btn btn-brand-action" type="button" data-bs-toggle="modal"
                            data-bs-target="#newEntryModal"><i class="bi bi-plus-lg me-1"></i> New User</button>
                        <input id="fileInput" type="file" style="display:none;" />
                    </div>
                </div>

                <!-- New Entry Modal -->
                <div class="modal fade" id="newEntryModal" tabindex="-1" aria-labelledby="newEntryModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="newEntryModalLabel">New User</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body" style="height: 25rem;">
                                <div class="row g-6">
                                    <div class="col-5 col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="User Email">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="User Password">
                                    </div>                                    
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-subtle" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-brand-action">Save</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CATEGORY INVENTORY TRACKER & DATA MATRIX -->
                <div class="table-responsive shadow rounded-4">
                    <table class="table table-premium align-middle">
                        <thead>
                            <tr>
                                <th>Acc. No.</th>
                                <th>Email / User</th>
                                <th>Password</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        
                        <tbody>
                            <tr>
                                <td>18 units</td>
                                <td><span class="badge badge-admin-status bg-secondary">Viber</span></td>
                                <td>18 units</td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-outline-subtle" type="button" data-bs-toggle="modal"
                                            data-bs-target="#editModal">Edit</button>
                                        <button class="btn btn-outline-subtle" type="button">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="editModalLabel">Edit User</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body" style="height: 25rem;">
                                <div class="row g-6">
                                    <div class="col-5 col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" placeholder="User Email">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" placeholder="User Password">
                                    </div>                                    
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-subtle" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-brand-action">Save</button>
                            </div>
                        </div>
                    </div>
                </div>

    <script>
        const uploadBtn = document.getElementById("uploadBtn");
        const fileInput = document.getElementById("fileInput");
        const selectedFileName = document.getElementById("selectedFileName");

        if (uploadBtn && fileInput) {
            uploadBtn.addEventListener("click", () => fileInput.click());
        }

        if (fileInput) {
            fileInput.addEventListener("change", (event) => {
                const file = event.target.files && event.target.files[0];
                if (selectedFileName) {
                    selectedFileName.textContent = file ? file.name : "No file chosen";
                }

                const importModal = new bootstrap.Modal(document.getElementById("importFileModal"));
                importModal.show();
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
